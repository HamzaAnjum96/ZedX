<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <!-- Social preview card, rendered to docs/assets/img/og-image.png by tools/build_pdf.mjs -->
  <base href="http://localhost:4174/ZedX/">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    .og { position: relative; display: grid; grid-template-columns: 500px 1fr; gap: 48px; width: 1200px; height: 630px; padding: 64px 0 56px 64px; background: var(--c-navy); color: var(--c-on-navy); }
    .og .tag { margin-bottom: 28px; font-size: 19px; line-height: 26px; color: var(--c-on-navy-muted); }
    .og h1 { color: var(--c-white); font-size: 50px; line-height: 58px; max-width: none; }
    .og .names { margin-top: 28px; font-size: 22px; line-height: 32px; color: var(--c-on-navy-muted); }
    .og .names strong { color: var(--c-white); }
    .og .note { position: absolute; left: 64px; bottom: 48px; font-size: 18px; color: var(--c-on-navy-muted); }
    .og .shots { display: grid; gap: 22px; align-content: start; padding-top: 6px; }
    .og .shot-frame { width: 640px; border-radius: 6px 0 0 6px; border-right: 0; border-color: var(--c-on-navy-rule); }
  </style>
</head>
<body>
  <div class="og">
    <div>
      <p class="tag">Independent promotional site</p>
      <h1>Workflows for<br>everyday work.<br>Sprints for<br>planned delivery.</h1>
      <p class="names"><strong>Group WorkStreams</strong> and <strong>Agile Sprints</strong>,<br>two ZedX apps</p>
    </div>
    <div class="shots">
      <div class="shot-frame"><img src="assets/img/screens/gw-board-catering-strip-1544.webp" width="772" height="274" alt=""></div>
      <div class="shot-frame"><img src="assets/img/screens/as-sprint-strip-1544.webp" width="772" height="274" alt=""></div>
    </div>
    <p class="note">Real screens from the ZedX demo</p>
  </div>
</body>
</html>

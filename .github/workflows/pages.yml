# Checks the brochure on every push and publishes docs/ to GitHub Pages
# from the default branch.
#
# One-time setup: Settings > Pages > Build and deployment > Source:
# "GitHub Actions". Until then the deploy job skips with a notice instead of
# failing, and "Run workflow" on this workflow publishes once it is switched on.

name: Brochure site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Links, anchors, icons and page basics
        run: python3 tools/check_site.py docs
      - name: tokens.css matches tokens.json
        run: python3 tools/build_tokens.py --check
      - name: WCAG contrast of every colour pair
        run: python3 .claude/skills/replica-design/contrast.py replica/design/tokens.json

  e2e:
    name: End-to-end and accessibility tests
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  deploy:
    name: Publish to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that GitHub Pages is switched on
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || true)
          if [ "$build_type" = "workflow" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is not switched on yet::In Settings > Pages, set Source to 'GitHub Actions', then run this workflow again (Actions > Brochure site > Run workflow). The site passed its checks and is ready to publish."
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.ready == 'true'
        with:
          path: docs
      - id: deployment
        if: steps.pages.outputs.ready == 'true'
        uses: actions/deploy-pages@v4
